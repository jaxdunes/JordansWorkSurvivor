                    const scoreId = Date.now().toString();

                    // Write to WORK league

                    return true;
                } catch (err) {

                    return false;

                    return true;

                    return false;

                    return true;

                    alert('❌ Error: ' + err.message);

                                        h('select', {
                                            id: 'dual-elim-episode-select',
                                            className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-red-500 focus:outline-none'
                                        },
                                            h('option', { value: '' }, 'Choose episode...'),
                                            ...[...Array(13)].map((_, i) => 
                                                h('option', { key: i + 1, value: i + 1 }, `Episode ${i + 1}`)
                                            )
                                        )
                                    ),
                                    
                                    h('button', {
                                        onClick: async () => {
                                            const playerId = document.getElementById('dual-elim-player-select').value;
                                            const episode = document.getElementById('dual-elim-episode-select').value;
                                            
                                            if (!playerId || !episode) {
                                                alert('Please select both player and episode');
                                                return;
                                            }
                                            
                                            const player = players.find(p => p.id === parseInt(playerId));
                                            if (confirm(`Eliminate ${player.name} in Episode ${episode} in BOTH leagues?`)) {
                                                const success = await markEliminationBoth(playerId, episode);
                                                if (success) {
                                                    setShowMarkElimination(false);
                                                }
                                            }
                                        },
                                        className: 'w-full px-6 py-4 bg-gradient-to-r from-red-500 to-rose-600 text-white rounded-xl font-bold hover:shadow-lg transition text-lg'
                                    }, '🚨 Mark Eliminated in Both')
                                )
                            )
                        )
                    ),
                    
                    // Mark Winner Modal
                    showMarkWinner && h('div', { 
                        className: 'modal-backdrop',
                        onClick: () => setShowMarkWinner(false)
                    },
                        h('div', { 
                            className: 'modal-content',
                            onClick: (e) => e.stopPropagation()
                        },
                            h('div', { className: 'p-6' },
                                h('div', { className: 'flex justify-between items-center mb-6' },
                                    h('h2', { 
                                        className: 'text-2xl font-black',
                                        style: { fontFamily: '"Bebas Neue", cursive' }
                                    }, '👑 MARK WINNER'),
                                    h('button', {
                                        onClick: () => setShowMarkWinner(false),
                                        className: 'text-gray-500 hover:text-gray-700'
                                    }, h(Icons.X, { size: 24 }))
                                ),
                                
                                h('div', { className: 'bg-gradient-to-r from-yellow-50 to-amber-50 p-4 rounded-lg mb-6 border-2 border-yellow-400' },
                                    h('p', { className: 'font-bold text-center text-gray-900' }, '🏆 This will mark the winner in BOTH leagues! 🏆'),
                                    h('p', { className: 'text-sm text-center text-gray-700 mt-1' }, 'Family League & Work League')
                                ),
                                
                                h('div', { className: 'space-y-4' },
                                    h('div', {},
                                        h('label', { className: 'block text-sm font-bold text-gray-700 mb-2' }, 'Select Sole Survivor'),
                                        h('select', {
                                            id: 'dual-winner-select',
                                            className: 'w-full px-4 py-3 border-2 border-gray-300 rounded-xl focus:border-yellow-500 focus:outline-none'
                                        },
                                            h('option', { value: '' }, 'Choose winner...'),
                                            ...players.map(player => 
                                                h('option', { key: player.id, value: player.id }, player.name)
                                            )
                                        )
                                    ),
                                    
                                    h('button', {
                                        onClick: async () => {
                                            const playerId = document.getElementById('dual-winner-select').value;
                                            
                                            if (!playerId) {
                                                alert('Please select a player');
                                                return;
                                            }
                                            
                                            const player = players.find(p => p.id === parseInt(playerId));
                                            if (confirm(`Mark ${player.name} as Sole Survivor in BOTH leagues?`)) {
                                                const success = await markWinnerBoth(playerId);
                                                if (success) {
                                                    setShowMarkWinner(false);
                                                }
                                            }
                                        },
                                        className: 'w-full px-6 py-4 bg-gradient-to-r from-yellow-500 to-amber-500 text-white rounded-xl font-bold hover:shadow-lg transition text-lg'
                                    }, '🎉 Mark Winner in Both')
                                )
                            )
                        )
                    )
                )
            );
        }
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(h(DualScoringPage));
    }
    </script>
</body>
</html>
